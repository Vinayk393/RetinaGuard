# ══════════════════════════════════════════════════════════════
# RetinaGuard — Experiment Config: EfficientNet-B0 + CE
# ══════════════════════════════════════════════════════════════
# Usage:
#   python src/run_experiment.py --config configs/ce.yaml
#
# Result (paper): QWK=0.8582 | Acc=0.820 | AUROC=0.9786  ← BEST MODEL
# ══════════════════════════════════════════════════════════════

experiment_name: "EfficientNet-B0 (CE)"

# ── Dataset
dataset_root: "/kaggle/input/datasets/sovitrath/diabetic-retinopathy-224x224-gaussian-filtered/gaussian_filtered_images/gaussian_filtered_images"
csv_path:     "/kaggle/input/datasets/sovitrath/diabetic-retinopathy-224x224-gaussian-filtered/train.csv"
output_dir:   "/kaggle/working/outputs"

class_dirs:
  "0": "No_DR"
  "1": "Mild"
  "2": "Moderate"
  "3": "Severe"
  "4": "Proliferate_DR"

# ── Data properties
img_size:     224
num_classes:  5
class_names:  ["No DR", "Mild", "Moderate", "Severe", "Proliferative"]

# ── Splits (stratified, seed-controlled)
train_frac:   0.70
val_frac:     0.15
test_frac:    0.15

# ── Preprocessing
use_clahe:    true    # CLAHE on LAB L-channel, clip=2.0, tile=8x8

# ── Model
model:        "efficientnet_b0"
pretrained:   true    # ImageNet weights via timm

# ── Loss
loss:         "ce"
label_smooth: 0.05   # mild smoothing to prevent overconfidence

# ── Training
lr:           0.0001
weight_decay: 0.0001
num_epochs:   20
batch_size:   32
patience:     5       # early stopping on Val QWK
use_amp:      true    # mixed-precision AMP
num_workers:  2       # DataLoader workers (Kaggle-stable)
tta_n:        5       # Test-Time Augmentation passes

# ── Reproducibility
seed: 42
